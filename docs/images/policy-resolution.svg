<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-labelledby="title">
  <title id="title">Policy resolution: the router checks the host group, then the directory group of the device's user, then the most specific subnet or network, then falls back to the default policy. The first tier that matches decides the policy, and within a tier the higher priority wins.</title>
  <style>
    text { font-family: 'Red Hat Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #151515; }
    .muted { fill: #6a6e73; } .small { font-size: 12px; } .bold { font-weight: 600; }
    .box { fill: #f0f1f3; stroke: #d2d4d8; stroke-width: 1.5; }
    .accent { fill: #e7f1fa; stroke: #0066cc; stroke-width: 1.5; }
    .zone { fill: none; stroke: #d2d4d8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .line { fill: none; stroke: #6a6e73; stroke-width: 1.5; }
    .flow { fill: none; stroke: #0066cc; stroke-width: 2; }
    .deny { fill: none; stroke: #b1380b; stroke-width: 2; stroke-dasharray: 5 4; }
    .head-line { fill: #6a6e73; } .head-flow { fill: #0066cc; } .head-deny { fill: #b1380b; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f2f2f2; } .muted { fill: #a2a5aa; }
      .box { fill: #212226; stroke: #35373c; } .accent { fill: #10243a; stroke: #4394e5; }
      .zone { stroke: #35373c; } .line { stroke: #a2a5aa; } .flow { stroke: #4394e5; } .deny { stroke: #f0561d; }
      .head-line { fill: #a2a5aa; } .head-flow { fill: #4394e5; } .head-deny { fill: #f0561d; }
    }
  </style>
  <defs>
    <marker id="head-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="head-line"/>
    </marker>
    <marker id="head-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="head-flow"/>
    </marker>
  </defs>

  <!-- Device tiers zone -->
  <rect class="zone" x="8" y="38" width="363" height="126" rx="8"/>
  <text class="small muted" x="14" y="28">Device tiers: IPv4 devices with a DHCP reservation</text>

  <!-- Tier 1 -->
  <rect class="box" x="20" y="50" width="138" height="100" rx="8"/>
  <text class="small muted" x="89" y="72" text-anchor="middle">Tier 1</text>
  <text class="bold" x="89" y="94" text-anchor="middle">Host group</text>
  <text class="small" x="89" y="114" text-anchor="middle">group set on the</text>
  <text class="small" x="89" y="130" text-anchor="middle">device in Hosts</text>

  <!-- Tier 2 -->
  <rect class="box" x="227" y="50" width="138" height="100" rx="8"/>
  <text class="small muted" x="296" y="72" text-anchor="middle">Tier 2</text>
  <text class="bold" x="296" y="94" text-anchor="middle">Directory group</text>
  <text class="small" x="296" y="114" text-anchor="middle">groups of the</text>
  <text class="small" x="296" y="130" text-anchor="middle">device's user</text>

  <!-- Tier 3 -->
  <rect class="box" x="435" y="50" width="138" height="100" rx="8"/>
  <text class="small muted" x="504" y="72" text-anchor="middle">Tier 3</text>
  <text class="bold" x="504" y="94" text-anchor="middle">Subnet or network</text>
  <text class="small" x="504" y="114" text-anchor="middle">most specific</text>
  <text class="small" x="504" y="130" text-anchor="middle">prefix wins</text>

  <!-- Tier 4 -->
  <rect class="box" x="642" y="50" width="138" height="100" rx="8"/>
  <text class="small muted" x="711" y="72" text-anchor="middle">Tier 4</text>
  <text class="bold" x="711" y="94" text-anchor="middle">Default policy</text>
  <text class="small" x="711" y="114" text-anchor="middle">every other</text>
  <text class="small" x="711" y="130" text-anchor="middle">client</text>

  <!-- "no match" arrows between tiers -->
  <line class="line" x1="158" y1="100" x2="225" y2="100" marker-end="url(#head-line)"/>
  <text class="small muted" x="191.5" y="92" text-anchor="middle">no match</text>
  <line class="line" x1="365" y1="100" x2="433" y2="100" marker-end="url(#head-line)"/>
  <text class="small muted" x="403" y="92" text-anchor="middle">no match</text>
  <line class="line" x1="573" y1="100" x2="640" y2="100" marker-end="url(#head-line)"/>
  <text class="small muted" x="606.5" y="92" text-anchor="middle">no match</text>

  <!-- "match" arrows down to the result -->
  <line class="flow" x1="89" y1="150" x2="89" y2="203" marker-end="url(#head-flow)"/>
  <text class="small muted" x="96" y="186">match</text>
  <line class="flow" x1="296" y1="150" x2="296" y2="203" marker-end="url(#head-flow)"/>
  <text class="small muted" x="303" y="186">match</text>
  <line class="flow" x1="504" y1="150" x2="504" y2="203" marker-end="url(#head-flow)"/>
  <text class="small muted" x="511" y="186">match</text>
  <line class="flow" x1="711" y1="150" x2="711" y2="203" marker-end="url(#head-flow)"/>
  <text class="small muted" x="718" y="186">always</text>

  <!-- Result -->
  <rect class="accent" x="20" y="205" width="760" height="60" rx="8"/>
  <text class="bold" x="400" y="230" text-anchor="middle">The client resolves through the policy of the first tier that matches</text>
  <text class="small muted" x="400" y="251" text-anchor="middle">Two policies claim the same thing in one tier? The higher priority wins.</text>
</svg>
