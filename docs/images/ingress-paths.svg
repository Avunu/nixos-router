<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title">
  <title id="title">Three ways in from the internet: a port forward, the reverse proxy, and Cloudflare Tunnel</title>
  <style>
    text { font-family: 'Red Hat Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #151515; }
    .muted { fill: #6a6e73; } .small { font-size: 12px; } .bold { font-weight: 600; }
    .box { fill: #f0f1f3; stroke: #d2d4d8; stroke-width: 1.5; }
    .accent { fill: #e7f1fa; stroke: #0066cc; stroke-width: 1.5; }
    .zone { fill: none; stroke: #d2d4d8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .line { fill: none; stroke: #6a6e73; stroke-width: 1.5; }
    .flow { fill: none; stroke: #0066cc; stroke-width: 2; }
    .deny { fill: none; stroke: #b1380b; stroke-width: 2; stroke-dasharray: 5 4; }
    .head-line { fill: #6a6e73; } .head-flow { fill: #0066cc; } .head-deny { fill: #b1380b; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f2f2f2; } .muted { fill: #a2a5aa; }
      .box { fill: #212226; stroke: #35373c; } .accent { fill: #10243a; stroke: #4394e5; }
      .zone { stroke: #35373c; } .line { stroke: #a2a5aa; } .flow { stroke: #4394e5; } .deny { stroke: #f0561d; }
      .head-line { fill: #a2a5aa; } .head-flow { fill: #4394e5; } .head-deny { fill: #f0561d; }
    }
  </style>
  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="head-flow"/>
    </marker>
    <marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="head-line"/>
    </marker>
  </defs>

  <!-- Column headers and zones -->
  <text x="16" y="28" class="muted bold">Internet</text>
  <text x="252" y="28" class="muted bold">Router</text>
  <text x="592" y="28" class="muted bold">LAN</text>
  <rect x="240" y="40" width="320" height="356" rx="8" class="zone"/>
  <rect x="580" y="40" width="204" height="356" rx="8" class="zone"/>

  <!-- Lane 1: port forward -->
  <text x="16" y="74" class="bold">Port forward</text>
  <rect x="16" y="86" width="80" height="50" rx="8" class="box"/>
  <text x="56" y="116" text-anchor="middle">Client</text>
  <path d="M96,111 H348" class="flow" marker-end="url(#arrow-flow)"/>
  <text x="168" y="103" text-anchor="middle" class="small muted">any tcp or udp port</text>
  <rect x="350" y="86" width="170" height="50" rx="8" class="accent"/>
  <text x="435" y="107" text-anchor="middle">nftables</text>
  <text x="435" y="125" text-anchor="middle" class="small muted">DNAT or IPv6 pinhole</text>
  <path d="M520,111 H608" class="flow" marker-end="url(#arrow-flow)"/>
  <rect x="610" y="86" width="150" height="50" rx="8" class="box"/>
  <text x="685" y="116" text-anchor="middle">LAN host</text>

  <!-- Lane 2: reverse proxy -->
  <text x="16" y="184" class="bold">Reverse proxy</text>
  <rect x="16" y="196" width="80" height="50" rx="8" class="box"/>
  <text x="56" y="226" text-anchor="middle">Client</text>
  <path d="M96,221 H348" class="flow" marker-end="url(#arrow-flow)"/>
  <text x="168" y="213" text-anchor="middle" class="small muted">tcp 80 and 443</text>
  <rect x="350" y="196" width="170" height="50" rx="8" class="accent"/>
  <text x="435" y="217" text-anchor="middle">router-proxy</text>
  <text x="435" y="235" text-anchor="middle" class="small muted">TLS ends here</text>
  <path d="M520,221 H608" class="flow" marker-end="url(#arrow-flow)"/>
  <rect x="610" y="196" width="150" height="50" rx="8" class="box"/>
  <text x="685" y="226" text-anchor="middle">LAN host</text>

  <!-- Lane 3: Cloudflare Tunnel -->
  <text x="16" y="294" class="bold">Cloudflare Tunnel</text>
  <rect x="16" y="306" width="80" height="64" rx="8" class="box"/>
  <text x="56" y="343" text-anchor="middle">Client</text>
  <path d="M96,338 H118" class="flow" marker-end="url(#arrow-flow)"/>
  <rect x="120" y="306" width="100" height="64" rx="8" class="box"/>
  <text x="170" y="334" text-anchor="middle">Cloudflare</text>
  <text x="170" y="352" text-anchor="middle" class="small muted">edge</text>
  <path d="M348,324 H222" class="line" marker-end="url(#arrow-line)"/>
  <text x="294" y="316" text-anchor="middle" class="small muted">outbound</text>
  <path d="M222,352 H348" class="flow" marker-end="url(#arrow-flow)"/>
  <text x="294" y="368" text-anchor="middle" class="small muted">requests</text>
  <rect x="350" y="306" width="170" height="64" rx="8" class="accent"/>
  <text x="435" y="334" text-anchor="middle">cloudflared</text>
  <text x="435" y="352" text-anchor="middle" class="small muted">no inbound port</text>
  <path d="M520,338 H608" class="flow" marker-end="url(#arrow-flow)"/>
  <rect x="610" y="306" width="150" height="64" rx="8" class="box"/>
  <text x="685" y="343" text-anchor="middle">LAN host</text>

  <!-- Legend -->
  <path d="M16,422 H54" class="flow" marker-end="url(#arrow-flow)"/>
  <text x="62" y="426" class="small muted">request path</text>
  <path d="M180,422 H218" class="line" marker-end="url(#arrow-line)"/>
  <text x="226" y="426" class="small muted">connection the router opens</text>
</svg>
