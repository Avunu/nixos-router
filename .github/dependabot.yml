version: 2

updates:
  # Every entry targets `develop`, the default branch. `main` is release-only and
  # moves only through release.yml, so a bump reaches routers when the release
  # pull request that collects it merges. Security updates always use the default
  # branch, which is `develop` once it is the default.
  #
  # Nix flake inputs.
  #
  # Deliberately NOT grouped: with no `groups:` Dependabot opens one PR per
  # outdated input (nixpkgs, git-hooks, disko, nixos-install-helper,
  # technitium-dns, technitium-library), so each is checked, held or merged on
  # its own. A Technitium bump no longer waits for nixpkgs: the DNS server is
  # compiled from the technitium inputs, not taken from nixpkgs, so the two move
  # independently. git-hooks, disko and nixos-install-helper follow nixpkgs, so
  # none of them brings a second nixpkgs into the lock.
  #
  # What does have to agree is the pair of Technitium inputs: `technitium-dns`
  # (vX.Y.Z) and `technitium-library` (dns-server-vX.Y.Z) are one release. Keeping
  # them together is the `technitium-version` check's job, not the grouping's: it
  # runs in the required "drift + build (fast)" job, so a PR that moves one ref
  # without the other fails it and cannot auto-merge.
  #
  # Dependabot cannot finish such a bump itself, though: it moves one ref per PR,
  # and the NuGet locks (pkgs/technitium-*/nuget-deps.json) have to be
  # regenerated with the release. Check out the PR branch and run
  # `nix develop -c update-deps --keep-technitium`, which moves the library to
  # the server's release, refreshes only the Technitium inputs and regenerates
  # the locks.
  #
  # Daily, because this lock is now what routers run: a router's host flake
  # follows nixos-router/nixpkgs (local/flake.nix), so its nightly upgrade
  # lands on this lock's nixpkgs — the rev the release gate cached — and
  # nothing newer. These pull requests auto-merge like every other Dependabot
  # update (dependabot-auto-merge.yml) once the required checks pass, above all
  # "VM tests (slow)", which boots real routers. They reach routers through the
  # release pull request that collects them (release.yml), so the prefix is
  # `fix`: a nixpkgs bump is a releasable change. That is the gate: a nixpkgs
  # bump is far too large to review by eye, and it is how routers get their
  # system security updates, so holding it for a human only delays them. No
  # cooldown: nixpkgs has already been through Hydra.
  - package-ecosystem: nix
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    commit-message:
      prefix: fix
      include: scope

  # The Cockpit plugin's npm dependencies.
  #
  # Safe to automate: pkgs/cockpit-router/package.nix builds with
  # `importNpmLock { npmRoot = ./.; }`, which resolves straight from
  # package-lock.json. There is no npmDepsHash to regenerate, so a lockfile bump
  # is the whole change — unlike the Technitium packages (pkgs/technitium-library,
  # pkgs/technitium-dns-server, pkgs/technitium-apps), whose nuget-deps.json has
  # to be regenerated by hand.
  #
  # The plugin is built by the `fast` CI job precisely so these PRs get a real
  # compile (tsc + oxlint + rollup) rather than only an eval. Nothing exercises
  # the UI in a browser, though, so a bump that compiles but breaks a page at
  # runtime still merges.
  #
  # The cooldown is the supply-chain control: malicious npm and crates.io
  # releases are usually caught and yanked within days, and holding a new
  # version back that long keeps one from ever reaching an auto-merged PR. The
  # plugin runs in Cockpit with the superuser bridge, i.e. as root. Security
  # updates are separate from version updates and are not delayed.
  - package-ecosystem: npm
    directory: /pkgs/cockpit-router
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 14
    commit-message:
      prefix: fix
      include: scope
    groups:
      npm:
        patterns: ["*"]

  # The reverse proxy's Rust dependencies (Pingora above all).
  #
  # Safe to automate for the same reason as npm: package.nix builds with
  # `cargoLock.lockFile = ./Cargo.lock`, so there is no cargoHash to
  # regenerate and a lockfile bump is the whole change. The package's
  # `cargo test` runs in its build, which the reverse-proxy VM test pulls in.
  # Cooldown as for npm.
  - package-ecosystem: cargo
    directory: /pkgs/router-proxy
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 14
    commit-message:
      prefix: fix
      include: scope
    groups:
      cargo:
        patterns: ["*"]

  # The documentation site's Jx toolchain (site/, built by site.yml).
  #
  # bun.lock is the whole change, as with npm above. What gates these PRs is
  # the `site build` job in site.yml, and only if it is a required check in the
  # `develop` ruleset (see that file's header); otherwise a bump that breaks the
  # build still auto-merges, and the only cost is that the site stops deploying
  # until someone fixes it. Nothing from site/ reaches a router. Cooldown as
  # for npm: the build runs these packages with the repository's token in
  # scope.
  - package-ecosystem: bun
    directory: /site
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      site:
        patterns: ["*"]

  # The CI that gates the above. Without this the workflow's actions silently
  # rot while everything they check stays current. The workflows pin every
  # action to a commit SHA (a tag can be moved; a SHA cannot), and Dependabot
  # updates the SHA and its `# vX` comment together. Cooldown as for npm: these
  # actions run with the repository's tokens.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

# Deliberately NOT covered:
#
#   pip — pkgs/router-dns-tools/pyproject.toml declares no runtime dependencies.
#   Everything the tools import at runtime comes from nixpkgs' python3Packages
#   via package.nix; the only thing pyproject pins is the setuptools build
#   backend, which nixpkgs supplies too. Dependabot PRs there would edit a file
#   that resolves nothing, while implying it does.
#
#   nuget — three reasons, stacking. Dependabot's nuget ecosystem discovers
#   .sln/.slnx/.proj entry points, .csproj/.vbproj/.fsproj projects,
#   packages.config, global.json, .config/dotnet-tools.json and
#   .props/.targets for Central Package Management; this repo contains none of
#   them. The nuget-deps.json files under pkgs/technitium-library,
#   pkgs/technitium-dns-server and pkgs/technitium-apps are not one either —
#   they are nixpkgs buildDotnetModule lockfiles ({pname, version, hash}),
#   which nothing outside Nix parses. And the real <PackageReference>
#   constraints live in the technitium-dns and technitium-library SOURCE
#   INPUTS, upstream, where we do not control them: each nuget-deps.json is
#   GENERATED to satisfy that restore, so bumping its entries independently
#   would desync it from the pinned source.
#
#   The risk on this path is staleness rather than being out of date — an input
#   moves and a lockfile is not regenerated — and that fails loudly at build
#   time (NU1102 during restore), caught by the `fast` CI job's
#   technitium-server check and by the `vm` job, which both compile the server
#   and apps. Regenerate with `nix develop -c update-deps`.
