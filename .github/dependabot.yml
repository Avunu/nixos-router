version: 2

updates:
  # Nix flake inputs.
  #
  # Grouped into one PR deliberately: nixpkgs and the `technitium-dns` source
  # input have to move together, because the DNS apps are compiled from that
  # input and loaded by nixpkgs' technitium-dns-server. Separate PRs would each
  # look fine in isolation and desync the pair on merge.
  #
  # Note that Dependabot cannot fix that drift by itself — `technitium-dns` is
  # pinned to a TAG in flake.nix, which never moves, so a nixpkgs bump leaves it
  # behind. The `technitium-version` check fails the PR when that happens; the
  # fix is to bump the ref in flake.nix by hand and run `nix run .#update-deps`.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nix:
        patterns: ["*"]

  # The Cockpit plugin's npm dependencies.
  #
  # Safe to automate: pkgs/cockpit-router/package.nix builds with
  # `importNpmLock { npmRoot = ./.; }`, which resolves straight from
  # package-lock.json. There is no npmDepsHash to regenerate, so a lockfile bump
  # is the whole change — unlike pkgs/technitium-apps, whose nuget-deps.json has
  # to be regenerated by hand.
  #
  # The plugin is built by the `fast` CI job precisely so these PRs get a real
  # compile (tsc + oxlint + rollup) rather than only an eval.
  - package-ecosystem: npm
    directory: /pkgs/cockpit-router
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns: ["*"]

  # The CI that gates the above. Without this the workflow's actions silently
  # rot while everything they check stays current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

# Deliberately NOT covered:
#
#   pip — pkgs/router-dns-tools/pyproject.toml declares no runtime dependencies.
#   Everything the tools import at runtime comes from nixpkgs' python3Packages
#   via package.nix; the only thing pyproject pins is the setuptools build
#   backend, which nixpkgs supplies too. Dependabot PRs there would edit a file
#   that resolves nothing, while implying it does.
#
#   nuget — three reasons, stacking. Dependabot's nuget ecosystem discovers
#   .sln/.slnx/.proj entry points, .csproj/.vbproj/.fsproj projects,
#   packages.config, global.json, .config/dotnet-tools.json and
#   .props/.targets for Central Package Management; this repo contains none of
#   them. pkgs/technitium-apps/nuget-deps.json is not one either — it is a
#   nixpkgs buildDotnetModule lockfile ({pname, version, hash}), which nothing
#   outside Nix parses. And the real <PackageReference> constraints live in the
#   technitium-dns SOURCE INPUT, upstream, where we do not control them:
#   nuget-deps.json is GENERATED to satisfy that restore, so bumping its entries
#   independently would desync it from the pinned source.
#
#   The risk on this path is staleness rather than being out of date — the input
#   moves and the lockfile is not regenerated — and that fails loudly at build
#   time (NU1102 during restore), caught by the `vm` CI job which compiles the
#   apps. Regenerate with `nix run .#update-deps`.
