# Auto-fixes router-settings.schema.json drift — the one thing checks.yml's
# `router-schema-fresh` check can only detect, never repair.
#
# Modeled on jxsuite/jx's schemas.yml, cut down to this repo's much smaller
# surface: one generator (`packages.settingsSchema-router`), one committed
# file, and no meaningful volume of fork pull requests. So unlike that
# workflow, this one skips a bespoke pointer-diff report generator, a
# fork-artifact fallback, and a checks-API neutral conclusion — a `git diff`
# against a single JSON file already tells a reviewer everything they need,
# and `router-schema-fresh`'s own failure message already tells a fork
# contributor how to fix it by hand.
#
# Pull requests only. `main` is protected by a ruleset that requires a pull
# request and the checks.yml status checks, so this lane can no longer push to
# it directly, and it does not need to: `router-schema-fresh` is part of the
# required "drift + build (fast)" check, so a stale schema cannot reach `main`
# in the first place. The lane pushes the regenerated file to the PR branch
# instead. Termination is a fixed point rather than a guard: the generator is
# deterministic, so a second run regenerates to identical bytes and pushes
# nothing.
#
# Fork pull requests are skipped outright: `GITHUB_TOKEN` is read-only
# against a fork by design, so there is nothing this lane could push.
name: schema-sync

on:
  pull_request:

# Pushes the regeneration. Nothing else in this workflow needs more than that.
permissions:
  contents: write

concurrency:
  group: schema-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    # A liveness bound, not a performance budget: the eval + jq diff is under
    # a minute, so anything near this means the build hung.
    timeout-minutes: 10
    steps:
      # No credentials on disk while the PR's own code is evaluated and built
      # below; the push step hands the token to that one `git push` instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Regenerate router-settings.schema.json if it drifted
        id: sync
        run: |
          set -euo pipefail
          fresh="$(nix build --no-link --print-out-paths \
            '.#packages.x86_64-linux.settingsSchema-router')"
          jq -S . "$fresh" > /tmp/fresh-schema.json
          if diff -q /tmp/fresh-schema.json \
              pkgs/cockpit-router/src/router-settings.schema.json >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp /tmp/fresh-schema.json pkgs/cockpit-router/src/router-settings.schema.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same-repo pull request: push the fix to its branch.
      - name: Push the regenerated schema
        if: steps.sync.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pkgs/cockpit-router/src/router-settings.schema.json
          git commit -m "chore(schema): regenerate stale router-settings.schema.json" \
            -m "Written by .github/workflows/schema-sync.yml. This file is a build output of router.* options, not hand-authored — see the comment above router-schema-fresh in flake.nix."
          # Fully qualified: the checkout above leaves a detached HEAD. The
          # token goes in as a header for this one command, the same way
          # actions/checkout would have persisted it.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${BRANCH}"
