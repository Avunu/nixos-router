# Checks the pull request title. Pull requests are squash-merged, so the title is the commit subject on
# `develop`, and that subject is the changelog line release-please writes. A title that is not
# conventional is a commit release-please ignores: the change ships with no changelog entry and no
# version bump, and nothing says so.
#
# A `<` or `>` in the subject is refused for a different reason. release-please HTML-escapes changelog
# text, then re-parses the release pull request body, which decodes the escapes back into live markup.
# That breaks the parse and drops the release for the whole component. jx has seen it happen.
#
# Required on the `develop` ruleset as "pr title" (docs/develop.md).
name: pr title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            style
            refactor
            test
            build
            ci
            chore
          subjectPattern: ^[^<>]+$
          subjectPatternError: "The subject must not contain '<' or '>': release-please escapes them and then drops the release."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
