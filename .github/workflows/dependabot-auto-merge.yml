name: Dependabot auto-merge

# Enables auto-merge on every Dependabot PR, in every ecosystem — nix lock bumps
# included. GitHub then merges it once the branch is mergeable and all
# *required* status checks pass. Tests are the gate, not review: nobody can
# meaningfully read a nixpkgs bump, and those bumps are how routers get their
# system security updates. Routers rebuild from `main` every night, so the
# required checks are all that stands between a bump and every router.
#
# Requires (one-time, in repo settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • A ruleset on `main` requiring a pull request and the checks.yml status
#     checks "drift + build (fast)" AND "VM tests (slow)". Without it,
#     `gh pr merge --auto` merges on nothing.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # The pull request's author, not `github.actor`: the actor is whoever
    # triggered this run, and a human re-running it on a Dependabot PR would
    # otherwise be treated like the bot.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
