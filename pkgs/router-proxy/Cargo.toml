[package]
name = "router-proxy"
version = "0.1.0"
edition = "2021"
description = "Hostname-routing HTTPS reverse proxy for the NixOS router (Pingora)"
license = "MIT"
publish = false

[dependencies]
pingora = { version = "0.9", default-features = false, features = ["proxy", "openssl"] }
async-trait = "0.1"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "signal", "macros"] }
http = "1"
libc = "0.2"

[profile.release]
lto = "thin"
